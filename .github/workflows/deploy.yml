name: Build and deploy

on:
    # IMDb refreshes its datasets around 01:00 UTC.
    schedule:
        - cron: '17 4 * * *'
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm ci --prefix sync
            - run: npm run typecheck --prefix sync
            # The data only changes once a day, so pushes and pull requests
            # reuse the latest fetched; nightly and manual runs fetch it
            # afresh. The key never matches; the prefix picks the newest.
            # The version in the prefix goes up when the data gets something
            # new that every build needs, like people, so none reuse data
            # from before it.
            - id: cached-data
              if: github.event_name == 'push' || github.event_name == 'pull_request'
              uses: actions/cache/restore@v6
              with:
                  path: data/shows.json
                  key: data-v2-${{ github.run_id }}
                  restore-keys: data-v2-

            - id: data
              if: steps.cached-data.outputs.cache-matched-key == ''
              run: npm run data
              env:
                  # For posters. They're drawn instead while it's unset.
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

            - id: pages
              if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v6

            - run: npm run build
              env:
                  PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
                  # The sync server's URL. Sync isn't offered while it's unset.
                  NEXT_PUBLIC_SYNC_URL: ${{ vars.SYNC_URL }}

            # Only once the site has built from it. Not from pull requests,
            # whose caches would shadow newer ones from main in their branch.
            - if: steps.data.outcome == 'success' && github.event_name != 'pull_request'
              uses: actions/cache/save@v6
              with:
                  path: data/shows.json
                  key: data-v2-${{ github.run_id }}

            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: out

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5

    # The sync server (sync/). Deployed on every push so its config, like
    # which origins it accepts, never lags behind the site.
    deploy-sync:
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: sync/package-lock.json

            - run: npm ci --prefix sync
            - run: npm run deploy --prefix sync
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
